plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0'
}

android {
    namespace 'com.appbrain.example'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    signingConfigs {
        release {
            def console = System.console()
            def pw = console == null ? ""
                    : new String(console.readPassword("\n\$ Enter keystore password: "))
            storeFile file('keystore')
            storePassword pw
            keyAlias 'android_release'
            keyPassword pw
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            // The AppBrain SDK ships its own consumer ProGuard rules inside the
            // AAR (proguard.txt), so they don't need to be repeated here.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'

    implementation 'com.appbrain:appbrain-sdk:+'
}
